name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check architectural boundaries
        run: bash scripts/check-boundaries.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore SystemX.Nuget.slnx

      - name: Verify code formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build SystemX.Nuget.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SystemX.Nuget.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack SystemX.Nuget.slnx -c Release --no-build -o artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/
