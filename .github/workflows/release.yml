name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore SystemX.Nuget.slnx

      - name: Build
        run: dotnet build SystemX.Nuget.slnx -c Release --no-restore

      - name: Test
        run: dotnet test SystemX.Nuget.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack SystemX.Nuget.slnx -c Release --no-build -o artifacts

      - name: Push NuGet packages
        run: dotnet nuget push "artifacts/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          generate_release_notes: true
